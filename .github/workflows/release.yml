name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Test server
        working-directory: apps/server
        run: |
          go vet ./...
          go test ./...

      - name: Build server (windows/amd64)
        working-directory: apps/server
        run: |
          mkdir -p ../../dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../dist/rcontrol-server.exe .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../dist/rcontrol-unlock.exe ./cmd/rcontrol-unlock
          cd ../../dist
          zip -9 rcontrol-server-windows-amd64.zip rcontrol-server.exe rcontrol-unlock.exe

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/rcontrol-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rcontrol-server-windows-amd64.zip
            dist/rcontrol-*.apk
