<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcontrol — settings</title>
<style>
  :root {
    --ink: #071013; --panel: #0C1A1E; --panel-hi: #11252A; --line: #1C3A40;
    --text: #E4FAFC; --dim: #86A9B0; --ice: #38E1F0; --soft: #B4F4FA;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text);
         font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .mark { width: 44px; height: 44px; flex: none; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; }
  .sub { color: var(--dim); font-size: 13px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; background: var(--panel-hi);
          border-radius: 50px; padding: 6px 12px; font-size: 12px; color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--ok); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
          padding: 18px; margin-top: 16px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
           color: var(--dim); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .field .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .field .v { font-size: 15px; margin-top: 2px; word-break: break-all; }
  .field.wide { grid-column: 1 / -1; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pin { font-size: 30px; letter-spacing: 3px; margin: 2px 0 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border-radius: 12px; padding: 10px 16px; border: 1px solid transparent;
           cursor: pointer; background: var(--ice); color: #03191C; font-weight: 600; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  button.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=number] { width: 100%; background: var(--ink); color: var(--text);
           border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; }
  input:focus { outline: none; border-color: var(--ice); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .addrs { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .addrRow { display: flex; align-items: center; gap: 10px; background: var(--ink);
             border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .addrRow .name { color: var(--dim); font-size: 12px; min-width: 96px; }
  .addrRow .ip { flex: 1; font-size: 13px; }
  .addrRow .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim);
                  border: 1px solid var(--line); border-radius: 50px; padding: 1px 8px; }
  .addrRow button.copy { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; background: var(--panel-hi); border: 1px solid var(--line);
           border-radius: 26px; transition: .15s; cursor: pointer; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
                  border-radius: 50%; background: var(--dim); transition: .15s; }
  .switch input:checked + .track { background: #0D3A41; border-color: var(--ice); }
  .switch input:checked + .track::after { left: 23px; background: var(--ice); }
  footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center;
           gap: 12px; flex-wrap: wrap; }
  .langs { display: flex; gap: 6px; }
  .langs button { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
  .langs button.active { border-color: var(--ice); color: var(--ice); }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
           background: var(--panel-hi); border: 1px solid var(--line); color: var(--text);
           padding: 10px 16px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none;
           transition: .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { border-color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 108 108" aria-hidden="true">
      <path d="M51,24.15 A30,30 0 0 0 51,83.85 Z" fill="#38E1F0"/>
      <path d="M57,24.15 A30,30 0 0 1 57,83.85 Z" fill="#B4F4FA"/>
    </svg>
    <div>
      <h1>rcontrol</h1>
      <div class="sub" id="sub">settings</div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><i class="dot ok"></i><span id="running" data-i18n="running">running</span></span>
  </header>

  <section class="card">
    <div class="label" data-i18n="status">Status</div>
    <div class="grid">
      <div class="field"><div class="k" data-i18n="pc">PC</div><div class="v" id="host">—</div></div>
      <div class="field"><div class="k" data-i18n="uptime">Uptime</div><div class="v" id="uptime">—</div></div>
      <div class="field">
        <div class="k" data-i18n="unlockHelper">Unlock helper</div>
        <div class="v" id="helper">—</div>
      </div>
      <div class="field wide">
        <div class="k" data-i18n="addresses">Addresses</div>
        <div class="addrs" id="addresses"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="label" data-i18n="pairing">Pairing</div>
    <div class="pin mono" id="pin">000-000</div>
    <div class="row">
      <button class="ghost" id="newPin" data-i18n="newPin">New PIN</button>
      <button class="danger" id="unpair" data-i18n="unpair">Unpair all devices</button>
    </div>
    <div class="hint" data-i18n="pairingHint">Type the PIN once on the phone.</div>
  </section>

  <section class="card">
    <div class="label" data-i18n="server">Server</div>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1">
        <div class="k" style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px" data-i18n="port">Port</div>
        <input type="number" id="port" min="1" max="65535" style="margin-top:4px">
      </div>
      <button class="ghost" id="savePort" data-i18n="saveRestart">Save &amp; restart</button>
    </div>
    <div class="row" style="margin-top:16px">
      <div style="flex:1">
        <div style="font-weight:600" data-i18n="startAtLogin">Start at login</div>
        <div class="hint" data-i18n="startAtLoginHint">Hidden window, starts with your session.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="startup">
        <span class="track"></span>
      </label>
    </div>
    <div class="row" style="margin-top:16px">
      <div style="flex:1">
        <div style="font-weight:600" data-i18n="dataFolder">Data folder</div>
        <div class="hint mono" id="dataDir">—</div>
      </div>
      <button class="ghost" id="openFolder" data-i18n="open">Open</button>
    </div>
  </section>

  <footer>
    <span class="hint" id="version">—</span>
    <div class="langs" aria-label="Language">
      <button class="ghost lang" data-lang="en">EN</button>
      <button class="ghost lang" data-lang="it">IT</button>
    </div>
    <button class="danger" id="quit" data-i18n="exit">Exit rcontrol</button>
  </footer>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const SUPPORTED = ["en", "it"];
let I18N = {};
let LANG = "en";
let state = null;
let uptimeLoadedAt = 0;
let toastTimer = null;

setInterval(() => {
  if (!state || !Number.isFinite(state.uptimeSeconds)) return;
  const elapsed = Math.floor((Date.now() - uptimeLoadedAt) / 1000);
  $("uptime").textContent = fmtUptime(state.uptimeSeconds + elapsed);
}, 1000);

function t(key, ...args) {
  let s = (I18N && I18N[key]) || key;
  for (const a of args) s = s.replace("%s", a);
  return s;
}

function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  document.title = t("pageTitle");
}

async function loadLang() {
  let lang = localStorage.getItem("lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
  if (!SUPPORTED.includes(lang)) lang = "en";
  LANG = lang;
  try {
    I18N = await fetch("/api/i18n?lang=" + lang).then((r) => r.json());
  } catch (_) {
    I18N = {};
  }
  applyI18n();
  document.documentElement.lang = lang;
  document.querySelectorAll(".langs button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

async function setLang(lang) {
  localStorage.setItem("lang", lang);
  await loadLang();
  if (state) render(state);
}

function toast(msg, bad) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 2600);
}

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function fmtUptime(total) {
  total = Math.max(0, Math.floor(total));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return (d > 0 ? d + "d " : "") + pad(h) + ":" + pad(m) + ":" + pad(s);
}

function render(s) {
  state = s;
  uptimeLoadedAt = Date.now();
  $("sub").textContent = t("subtitle") + " · " + s.version;
  $("host").textContent = s.host || "—";
  $("uptime").textContent = Number.isFinite(s.uptimeSeconds) ? fmtUptime(s.uptimeSeconds) : "—";
  $("pin").textContent = s.pin || "—";
  $("port").value = s.port;
  $("startup").checked = !!s.startup;
  $("dataDir").textContent = s.dataDir || "—";
  $("version").textContent = t("versionLine", s.version);
  $("helper").textContent = s.helper ? t("helperInstalled") : t("helperMissing");
  $("helper").style.color = s.helper ? "var(--ok)" : "var(--dim)";

  const box = $("addresses");
  box.innerHTML = "";
  const list = (s.addresses && s.addresses.length) ? s.addresses : [];
  for (const a of list) {
    const row = document.createElement("div");
    row.className = "addrRow";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = a.name;
    const ip = document.createElement("span");
    ip.className = "ip mono";
    ip.textContent = a.ip + ":" + s.port;
    row.append(name, ip);
    const kind = a.kind === "lan" ? t("tagLan") : a.kind === "tailscale" ? t("tagTailscale") : "";
    if (kind && kind.toLowerCase() !== a.name.toLowerCase()) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = kind;
      row.appendChild(tag);
    }
    const copy = document.createElement("button");
    copy.className = "ghost copy";
    copy.textContent = t("copy");
    copy.onclick = async () => {
      const text = a.ip + ":" + s.port;
      try {
        await navigator.clipboard.writeText(text);
        toast(t("copied", text));
      } catch (_) {
        toast(t("copyFailed"), true);
      }
    };
    row.appendChild(copy);
    box.appendChild(row);
  }
}

async function load() {
  try {
    render(await fetch("/api/state").then((r) => r.json()));
  } catch (e) {
    toast(t("unreachable", e.message), true);
  }
}

$("newPin").onclick = async () => {
  try {
    const d = await post("/api/pin");
    $("pin").textContent = d.pin;
    toast(t("newPinToast", d.pin));
  } catch (e) { toast(e.message, true); }
};

$("unpair").onclick = async () => {
  if (!confirm(t("confirmUnpair"))) return;
  try {
    await post("/api/unpair");
    toast(t("unpaired"));
  } catch (e) { toast(e.message, true); }
};

$("startup").onchange = async (ev) => {
  try {
    const d = await post("/api/startup", { enabled: ev.target.checked });
    ev.target.checked = !!d.enabled;
    toast(d.enabled ? t("startOn") : t("startOff"));
  } catch (e) {
    ev.target.checked = !ev.target.checked;
    toast(e.message, true);
  }
};

$("savePort").onclick = async () => {
  const port = parseInt($("port").value, 10);
  if (!port || port < 1 || port > 65535) { toast(t("invalidPort"), true); return; }
  try {
    await post("/api/port", { port });
    await post("/api/restart");
    toast(t("restarting", port));
    setTimeout(load, 2500);
  } catch (e) { toast(e.message, true); }
};

$("openFolder").onclick = async () => {
  try { await post("/api/open"); } catch (e) { toast(e.message, true); }
};

$("quit").onclick = async () => {
  if (!confirm(t("confirmExit"))) return;
  try {
    await post("/api/quit");
    $("running").textContent = t("stopped");
    toast(t("stopped"));
  } catch (e) { toast(e.message, true); }
};

document.querySelectorAll(".langs button").forEach((b) => {
  b.onclick = () => setLang(b.dataset.lang);
});

(async () => {
  await loadLang();
  await load();
})();
</script>
</body>
</html>
